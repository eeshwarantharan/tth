[project]
name = "tth"
version = "0.1.0"
description = "tiny terminal helper: a local agent that looks before it acts and knows when to call for help"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "openai>=1.40",
  "python-chess>=1.999",
  "tree-sitter>=0.23",
  "tree-sitter-bash>=0.23",
  "mcp>=1.2",
  "a2a-sdk>=0.2",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.20"]

[project.scripts]
tth = "tth.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tth", "experts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S311", "E501"]  # line length is left to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pyright]
include = ["src", "train", "evals", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# python-chess InfoDict keys are optional in the stubs; Stockfish always returns score/pv at a depth limit.
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
