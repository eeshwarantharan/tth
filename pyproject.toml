# Development workspace. The packages people install are in packages/.
[project]
name = "tth-dev"
version = "0"
requires-python = ">=3.11"
dependencies = ["tth[expert]", "tth[mlx]; sys_platform == 'darwin'", "tth-gym[chess]"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "import-linter>=2.0", "pyyaml>=6.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tth = { workspace = true }
tth-gym = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S311", "E501"]  # line length is left to the formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"evals/**" = ["S604"]  # `shell=` here names the user's shell, and nothing is run through one

[tool.ruff.lint.isort]
known-first-party = ["tth", "tth_gym", "evals"]

[tool.pyright]
include = ["packages", "evals", "tests"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# python-chess InfoDict keys are optional in the stubs; Stockfish always returns score/pv at a depth limit.
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Dependencies point one way. CI fails on anything else. Run: uv run lint-imports
[tool.importlinter]
root_packages = ["tth", "tth_gym", "evals"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "tth is layered"
type = "layers"
layers = [
  "tth.cli",
  "tth.expert | tth.ui | tth.shell",
  "tth.agent",
  "tth.a2a | tth.inference | tth.mcp",
  "tth.sandbox",
  "tth.safety",
  "tth.trace | tth.core",
]

[[tool.importlinter.contracts]]
name = "The product never depends on training or held-out evals"
type = "forbidden"
source_modules = ["tth"]
forbidden_modules = ["tth_gym", "evals", "torch", "peft", "chess", "yaml"]

[[tool.importlinter.contracts]]
name = "Training never sees held-out evals"
type = "forbidden"
source_modules = ["tth_gym"]
forbidden_modules = ["evals"]

[[tool.importlinter.contracts]]
name = "The agent reaches tools only through MCP"
type = "forbidden"
source_modules = ["tth.agent", "tth.cli", "tth.ui"]
forbidden_modules = ["tth.mcp.toolbox", "tth.mcp.server"]
allow_indirect_imports = true
ignore_imports = ["tth.cli.main -> tth.mcp.server"]  # `tth mcp` serves it, and doesn't call its tools

[[tool.importlinter.contracts]]
name = "Only the escalation path sends anything to an expert"
type = "forbidden"
source_modules = ["tth.agent.product", "tth.agent.loop", "tth.ui", "tth.mcp", "tth.inference"]
forbidden_modules = ["tth.a2a"]
