name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Dependency rules
        run: uv run lint-imports

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts the unprivileged user namespaces bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: uv sync --frozen
      - name: Safety suite
        run: uv run pytest tests/safety
      - name: All tests
        run: uv run pytest
