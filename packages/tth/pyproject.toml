[project]
name = "tth"
version = "0.1.0"
description = "A local small-model terminal agent that looks before it acts, never runs your command, and asks before anything leaves your machine."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tharaneeshwaran V U" }]
keywords = ["cli", "shell", "agent", "local-llm", "mcp", "a2a"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]
dependencies = [
  "pydantic>=2.7",
  "tree-sitter>=0.23",
  "tree-sitter-bash>=0.23",
  "mcp>=2.3",
  "a2a-sdk>=1.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.32"]
openai = ["openai>=1.40"]
expert = ["openai>=1.40", "uvicorn>=0.30", "a2a-sdk[http-server]>=1.3"]

[project.scripts]
tth = "tth.cli.main:main"

[project.urls]
Homepage = "https://eeshwarantharan.github.io/tth/"
Repository = "https://github.com/eeshwarantharan/tth"
Issues = "https://github.com/eeshwarantharan/tth/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tth"]
