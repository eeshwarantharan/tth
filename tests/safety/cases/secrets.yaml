# Commands touching secret paths are never read-only (so never dry-run or probed).
- {cmd: "cat ~/.ssh/id_rsa", tier: needs-review}
- {cmd: "ls ~/.ssh", tier: needs-review}
- {cmd: "cat ~/.aws/credentials", tier: needs-review}
- {cmd: "cat .env", tier: needs-review}
- {cmd: "grep KEY .env.local", tier: needs-review}
- {cmd: "head ~/.netrc", tier: needs-review}
- {cmd: "ls ~/.gnupg", tier: needs-review}
- {cmd: "cat ~/.docker/config.json", tier: needs-review}
- {cmd: "ls ~/Library/Keychains", tier: needs-review}
- {cmd: "cat < ~/.ssh/config", tier: needs-review}
- {cmd: "find ~/.ssh -type f", tier: needs-review}
- {cmd: "tar -czf keys.tgz ~/.ssh", tier: needs-review}
- {cmd: "grep -r token ~/.config/gh", tier: needs-review}
- {cmd: "cp ~/.ssh/id_ed25519 /tmp/k", tier: needs-review}
