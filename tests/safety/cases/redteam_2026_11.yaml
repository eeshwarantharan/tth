- {cmd: "echo \"${x:-$(rm y)}\"", tier: needs-review, staged: null}
- {cmd: "X=\"$(rm y)\" ls", tier: needs-review, staged: null}

# Dynamic arguments can become write or exec flags at runtime.
- {cmd: "find . $(echo -delete)", tier: needs-review}
- {cmd: "find . \"$x\"", tier: needs-review}
- {cmd: "sed $(echo -i) s/a/b/ f", tier: needs-review}
- {cmd: "awk \"$prog\" f", tier: needs-review}
