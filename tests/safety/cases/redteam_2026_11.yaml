- {cmd: "sed '/x/,/y/w pwned' f", tier: needs-review}
- {cmd: "sed 's/a/b/w pwned' f", tier: needs-review}
- {cmd: "sed 's/a/b/e' f", tier: needs-review}
- {cmd: "sed -n '1!w pwned' f", tier: needs-review}
