# Bypasses found by the November 2026 audit. Each was reproduced before the fix.
# See docs/analysis/2026-11-audit.md, section 4.

# Heredocs and herestrings hide commands from the walker.
- {cmd: "cat <<EOF | sh\nrm -rf ~\nEOF", tier: denied, staged: null}
- {cmd: "cat <<EOF | bash\necho hi\nEOF", tier: denied, staged: null}
- {cmd: "cat <<EOF && rm -rf /\nhi\nEOF", tier: denied, staged: null}
- {cmd: "cat <<EOF; rm -rf /\nhi\nEOF", tier: needs-review, staged: null}
- {cmd: "cat <<EOF\n$(rm x)\nEOF", tier: needs-review, staged: null}
- {cmd: "cat <<EOF\n${x:-$(rm x)}\nEOF", tier: needs-review, staged: null}
- {cmd: "cat <<< \"$(rm x)\"", tier: needs-review, staged: null}
- {cmd: "sh <<EOF\nls\nEOF", tier: denied, staged: null}
- {cmd: "bash <<< 'rm -rf ~'", tier: denied, staged: null}
- {cmd: "cat <<EOF\nplain text\nEOF", tier: read-only}

# Expansions were treated as opaque text.
- {cmd: "echo ${x:-$(rm y)}", tier: needs-review, staged: null}
